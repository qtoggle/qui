name: Main

on: push

permissions:
  id-token: write
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Lint JS Code
        uses: qtoggle/actions-common/actions/lint-js@v1
      - name: Lint Python Code
        uses: qtoggle/actions-common/actions/lint-python@v1
        with:
          source-dir: qui
  jsdoc:
    name: Publish Docs
    if: startsWith(github.ref, 'refs/tags/version-')
    runs-on: ubuntu-latest
    needs:
      - lint
    steps:
      - name: Source code checkout
        uses: actions/checkout@v4
      - name: Replace source version
        uses: qtoggle/actions-common/actions/replace-source-version@v1
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: |
          npm install && rm -rf docs/* js/lib/* && npx jsdoc -c jsdoc.conf.json
      - name: Deploy GitHub pages
        uses: JamesIves/github-pages-deploy-action@releases/v3
        with:
          ACCESS_TOKEN: ${{ secrets.GH_PAGES_ACCESS_TOKEN }}
          BRANCH: gh-pages
          FOLDER: docs
  build-python:
    name: Build Python
    runs-on: ubuntu-latest
    steps:
      - name: Build Python package
        uses: qtoggle/actions-common/actions/build-python-package@v1
  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/version-')
    runs-on: ubuntu-latest
    needs:
      - lint
      - jsdoc
      - build-python
    steps:
      - name: Source code checkout
        uses: actions/checkout@v4
      - name: Replace source version
        uses: qtoggle/actions-common/actions/replace-source-version@v1
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish to NPM
        run: |
          npm install -g npm@12
          version=$(node -p "require('./package.json').version")
          if [[ "${version}" == *-* ]]; then
              # A prerelease must not take over the "latest" dist-tag, and npm insists on an explicit
              # --tag for one. Name the tag after the prerelease identifier: 1.20.0-alpha.1 -> alpha.
              npm_tag="${version#*-}"
              npm_tag="${npm_tag%%.*}"
              echo "Publishing ${version} under dist-tag ${npm_tag}"
              npm publish --tag "${npm_tag}"
          else
              echo "Publishing ${version} under dist-tag latest"
              npm publish
          fi
      - name: Fetch python dist folder
        uses: actions/download-artifact@v4
        with:
          name: python-package-dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
